plugins {
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group

// Allow callers to select the Mythic build variant with -Pis_Mythic_version=true|false.
// The default is false, including for local builds that do not pass the property.
def mythicVersionRaw = providers.gradleProperty('is_Mythic_version').getOrElse('false')
if (!(mythicVersionRaw in ['true', 'false'])) {
    throw new GradleException("is_Mythic_version must be 'true' or 'false' (received: '${mythicVersionRaw}')")
}
def isMythicVersion = mythicVersionRaw.toBoolean()
logger.lifecycle("Building Mythic variant: ${isMythicVersion}")

repositories {
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
}

dependencies {
    // Compile against the same Create API version targeted by the mod metadata.
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    implementation("net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    testImplementation("org.junit.jupiter:junit-jupiter:5.11.4")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Expose the selected variant in the built JAR so build artifacts can be identified.
tasks.withType(Jar).configureEach {
    manifest {
        attributes('Is-Mythic-Version': isMythicVersion.toString())
    }
}

// The NeoForge ModDev plugin adds Minecraft/NeoForge dependencies to the main
// source set. Make that same compile/runtime classpath available to JUnit tests.
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

neoForge {
    version = neo_forge_version

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_forge_version      : neo_forge_version,
            neo_forge_version_range: neo_forge_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
